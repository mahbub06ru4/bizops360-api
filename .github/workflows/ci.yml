name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sail -d testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Test-time cache/queue/session come from phpunit.xml (array/sync/array).
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, mbstring, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Format check (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Run migrations
        run: php artisan migrate --force

      - name: Tests (Pest)
        run: php artisan test

      - name: OpenAPI contract generates
        run: php artisan scramble:export

  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -f docker/production/Dockerfile -t bizops360-api:ci .

      - name: Boot it and check /up
        run: |
          docker run -d --name prod-smoke -p 8080:8080 \
            -e APP_KEY=base64:$(openssl rand -base64 32) \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/ci.sqlite \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync \
            bizops360-api:ci
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/up || true)
            [ "$code" = "200" ] && echo "up: $code" && exit 0
            sleep 2
          done
          echo "health check never returned 200" >&2
          docker logs prod-smoke
          exit 1

      - name: Boot the worker role
        run: |
          docker run -d --name worker-smoke -e CONTAINER_ROLE=worker \
            -e APP_KEY=base64:$(openssl rand -base64 32) \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/ci-worker.sqlite \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync \
            bizops360-api:ci
          sleep 5
          docker logs worker-smoke
          status=$(docker inspect -f '{{.State.Status}}' worker-smoke)
          docker rm -f worker-smoke >/dev/null
          [ "$status" = "running" ] || { echo "worker exited early: $status" >&2; exit 1; }

      - name: Boot the reverb role
        run: |
          docker run -d --name reverb-smoke -e CONTAINER_ROLE=reverb \
            -e APP_KEY=base64:$(openssl rand -base64 32) \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/ci-reverb.sqlite \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync \
            -e REVERB_APP_ID=ci -e REVERB_APP_KEY=ci -e REVERB_APP_SECRET=ci \
            bizops360-api:ci
          sleep 5
          docker logs reverb-smoke
          status=$(docker inspect -f '{{.State.Status}}' reverb-smoke)
          docker rm -f reverb-smoke >/dev/null
          [ "$status" = "running" ] || { echo "reverb exited early: $status" >&2; exit 1; }
