# The Postgres database is Neon (external, not Render Postgres) — see
# docs/ops/DEPLOY.md. Set DB_URL on both services below to Neon's
# connection string once it exists.

services:
  - type: web
    name: bizops360-api
    runtime: docker
    dockerfilePath: docker/production/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: CONTAINER_ROLE
        value: web
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # `php artisan key:generate --show`, paste once, never in git
      - key: APP_URL
        value: https://bizops360-api.onrender.com
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false # Neon connection string (postgresql://... ?sslmode=require)
      # Minimal live config: Render + Neon only, no Redis/S3 account needed.
      # Cache/sessions/queue run in-process or against Postgres; file uploads
      # go to local disk, which Render wipes on every redeploy — fine to prove
      # the app out, not fine for real document uploads. To upgrade later:
      # CACHE_STORE=redis, SESSION_DRIVER=redis with REDIS_URL (e.g. Upstash —
      # Render's own Key Value now requires a paid plan), and FILESYSTEM_DISK=s3
      # with the AWS_* vars (e.g. Cloudflare R2) — see docs/ops/DEPLOY.md.
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync # no paid worker dyno on the free plan; jobs run inline.
      - key: SESSION_DRIVER
        value: cookie # no `sessions` table migrated; the API is bearer-token (Sanctum) anyway.
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: FILESYSTEM_DISK
        value: local
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://app.bizops360.example (Flutter web build's origin)
      - key: SENTRY_LARAVEL_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.2"
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_APP_ID
        sync: false
      - key: REVERB_APP_KEY
        sync: false
      - key: REVERB_APP_SECRET
        sync: false
      - key: REVERB_HOST
        value: bizops360-api-reverb.onrender.com
      - key: REVERB_PORT
        value: "443"
      - key: REVERB_SCHEME
        value: https

  - type: web
    name: bizops360-api-reverb
    runtime: docker
    dockerfilePath: docker/production/Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    envVars:
      - key: CONTAINER_ROLE
        value: reverb
      - key: APP_KEY
        fromService:
          type: web
          name: bizops360-api
          envVarKey: APP_KEY
      - key: REVERB_APP_ID
        fromService:
          type: web
          name: bizops360-api
          envVarKey: REVERB_APP_ID
      - key: REVERB_APP_KEY
        fromService:
          type: web
          name: bizops360-api
          envVarKey: REVERB_APP_KEY
      - key: REVERB_APP_SECRET
        fromService:
          type: web
          name: bizops360-api
          envVarKey: REVERB_APP_SECRET
      - key: APP_ENV
        value: production
      - key: DB_CONNECTION
        value: sqlite # Reverb never touches the app DB; avoids needing DB_URL here too
      - key: CACHE_STORE
        value: array
      - key: SESSION_DRIVER
        value: array
      - key: QUEUE_CONNECTION
        value: sync

# A dedicated `type: worker` service (queue processing off the request/response
# cycle) requires a paid Render plan — free plan supports only `web` services.
# QUEUE_CONNECTION=sync above runs jobs inline instead. To restore a real worker
# once you're on a paid plan, re-add a `type: worker` service here with
# `plan: starter`, `QUEUE_CONNECTION=redis`, and env vars sourced via
# `fromService` from `bizops360-api` (APP_KEY, DB_URL, REDIS_URL, AWS_*).
